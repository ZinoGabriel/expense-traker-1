<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>🔐 Welcome Back</h2>
        <p class="subtitle">Log in to view your saved expense history</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>
        <p id="authMessage" class="subtitle" role="status" aria-live="polite"></p>
        <p class="footer-text">New here? <a href="signup.html">Create an account</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        document.querySelector('#loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const message = document.querySelector('#authMessage');
            const button = this.querySelector('button[type="submit"]');
            const email = document.querySelector('#loginEmail').value.trim();
            const password = document.querySelector('#loginPassword').value;

            if (!window.spendGuardSupabase) {
                message.textContent = 'Sign-in is not connected yet. Add your Supabase project URL and public anon key to supabase-config.js, then reload. Create your account after setup.';
                return;
            }

            button.disabled = true;
            message.textContent = 'Signing in...';
            const { error } = await window.spendGuardSupabase.auth.signInWithPassword({ email, password });
            button.disabled = false;

            if (error) {
                message.textContent = error.message;
                return;
            }

            localStorage.removeItem('registeredUser');
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
